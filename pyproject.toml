[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "omnia-mcp"
version = "0.1.0"
description = "MCP access to JEV and local LAYA with validated decisions and durable records."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{name = "OMNIA EYE Corporation"}]
keywords = ["mcp", "jev", "laya", "typed-decisions", "agents", "omnia"]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["mcp==2.2.0", "httpx>=0.28.1,<0.29", "pydantic>=2.12,<3", "pydantic-settings>=2.12,<3"]

[project.optional-dependencies]
local-laya = ["laya==0.4.17"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<0.17", "build>=1.2,<2", "twine>=6,<8"]

[project.scripts]
omnia-mcp = "omnia_mcp.cli:main"

[project.urls]
Homepage = "https://www.eyeomnia.com"
Repository = "https://github.com/Omniaeye/omnia-mcp"
Issues = "https://github.com/Omniaeye/omnia-mcp/issues"
Documentation = "https://github.com/Omniaeye/omnia-mcp/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/omnia_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in real provider inference"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

