name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Unit and stdio integration tests
        run: python -m pytest -m "not live"
        env:
          TYPESAFE_API_KEY: ''
          OMNIA_LAYA_OFFLINE: 'true'
          HF_HUB_OFFLINE: '1'
          PYTHONUTF8: '1'

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Build and validate metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
          python -m build
          python -m twine check dist/*
      - name: Smoke test installed wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/omnia-wheel"
          "$RUNNER_TEMP/omnia-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/omnia-wheel/bin/omnia-mcp" version
          "$RUNNER_TEMP/omnia-wheel/bin/omnia-mcp" doctor
          "$RUNNER_TEMP/omnia-wheel/bin/omnia-mcp" schemas > omnia-schemas.json
      - name: Save distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
